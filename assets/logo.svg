<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Maquina-v7 logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="55%" stop-color="#7b5bff"/>
      <stop offset="100%" stop-color="#b15bff"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2330"/>
      <stop offset="100%" stop-color="#0e1622"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#9fd0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9fd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tarjeta redondeada -->
  <rect x="10" y="10" width="220" height="220" rx="46" fill="url(#bg)"/>
  <rect x="10" y="10" width="220" height="220" rx="46" fill="url(#glow)"/>

  <!-- Monitor -->
  <rect x="52" y="58" width="136" height="92" rx="12" fill="url(#scr)" stroke="#cfe2ff" stroke-width="3"/>
  <rect x="66" y="72" width="108" height="58" rx="6" fill="#11203a"/>
  <!-- Barra de "ventana" -->
  <circle cx="76" cy="82" r="3.2" fill="#ff6b6b"/>
  <circle cx="86" cy="82" r="3.2" fill="#ffd166"/>
  <circle cx="96" cy="82" r="3.2" fill="#06d6a0"/>
  <!-- Simbolo RDP (pantalla) -->
  <path d="M78 100 h64 M78 110 h44" stroke="#5b8cff" stroke-width="3" stroke-linecap="round"/>
  <!-- Base del monitor -->
  <rect x="108" y="150" width="24" height="12" fill="#cfe2ff"/>
  <rect x="86" y="162" width="68" height="7" rx="3.5" fill="#cfe2ff"/>

  <!-- Nube -->
  <path d="M70 132 a20 20 0 0 1 38 -8 a16 16 0 0 1 30 4 a15 15 0 0 1 -4 30 h-58 a17 17 0 0 1 -6 -26 z"
        fill="#ffffff" opacity="0.92" transform="translate(6 0)"/>

  <!-- Texto v7 -->
  <text x="120" y="206" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">v7</text>
</svg>
